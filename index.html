<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Soundcheck — AI Music Showcase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0c0a;
    --bg-2: #16120e;
    --panel: #1c1814;
    --panel-2: #221d18;
    --border: #2a2520;
    --text: #f3ebe1;
    --muted: #8a7e70;
    --dim: #5a5147;
    --accent: #e8a87c;
    --accent-2: #d97757;
    --accent-glow: rgba(232, 168, 124, 0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-weight: 300;
    min-height: 100%;
    scroll-behavior: smooth;
  }
  body {
    background:
      radial-gradient(ellipse 80% 50% at 20% 10%, rgba(232, 168, 124, 0.08), transparent 60%),
      radial-gradient(ellipse 60% 40% at 85% 90%, rgba(217, 119, 87, 0.06), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  /* TOP SECTION: Player + Playlist */
  .top-section {
    display: grid;
    grid-template-columns: 1fr 380px;
    height: 100vh;
    max-width: 1400px;
    margin: 0 auto;
    padding: 32px;
    gap: 28px;
  }
  .player {
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px;
    position: relative;
    overflow: hidden;
  }
  .brand {
    display: flex;
    flex-direction: column;
    margin-bottom: 24px;
  }
  .brand h1 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 22px;
    letter-spacing: -0.02em;
  }
  .brand .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-top: 6px;
  }
  .art-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-height: 0;
  }
  .art {
    position: relative;
    aspect-ratio: 1;
    max-height: 100%;
    max-width: 100%;
    width: 420px;
    border-radius: 16px;
    overflow: hidden;
    background: linear-gradient(135deg, #2a2520 0%, #1c1814 100%);
    box-shadow:
      0 20px 60px rgba(0,0,0,0.5),
      0 0 80px var(--accent-glow);
    transition: transform 0.6s cubic-bezier(.2,.8,.2,1);
  }
  .art.playing { transform: scale(1.02); }
  .art img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .art .placeholder {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: conic-gradient(from 220deg at 50% 50%,
      var(--accent-2), #8a3f2a, #2a1810, var(--accent), var(--accent-2));
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 80px;
    color: rgba(255,255,255,0.85);
  }
  canvas#viz {
    position: absolute;
    inset: auto 0 0 0;
    height: 80px;
    width: 100%;
    pointer-events: none;
  }
  .track-info {
    margin-top: 28px;
    text-align: center;
  }
  .track-info .title {
    font-family: 'Fraunces', serif;
    font-size: 26px;
    font-weight: 400;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .track-info .artist {
    color: var(--muted);
    font-size: 14px;
    letter-spacing: 0.02em;
  }
  .seek {
    margin-top: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
  .seek .bar {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    position: relative;
    cursor: pointer;
    touch-action: none;
  }
  .seek .bar::before {
    content: '';
    position: absolute;
    top: -14px; bottom: -14px; left: 0; right: 0;
  }
  .seek .fill {
    position: absolute; inset: 0 auto 0 0;
    width: 0%;
    background: linear-gradient(90deg, var(--accent-2), var(--accent));
    border-radius: 2px;
  }
  .seek .knob {
    position: absolute;
    top: 50%;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--accent);
    transform: translate(-50%, -50%);
    box-shadow: 0 0 12px var(--accent-glow);
    left: 0%;
  }
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin-top: 20px;
  }
  .btn {
    background: transparent;
    border: none;
    color: var(--text);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s ease, color 0.2s ease;
  }
  .btn:hover { color: var(--accent); transform: scale(1.1); }
  .btn:disabled { color: var(--dim); cursor: not-allowed; }
  .btn:disabled:hover { transform: none; color: var(--dim); }
  .btn svg { width: 22px; height: 22px; }
  .btn.play {
    background: var(--text);
    color: var(--bg);
    width: 56px; height: 56px;
    border-radius: 50%;
    box-shadow: 0 6px 20px rgba(243, 235, 225, 0.15);
  }
  .btn.play:hover { background: var(--accent); transform: scale(1.05); }
  .volume {
    margin-top: 28px;
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
  }
  .volume svg { width: 16px; height: 16px; color: var(--muted); }
  .volume .bar {
    width: 120px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    position: relative;
    cursor: pointer;
    touch-action: none;
  }
  .volume .bar::before {
    content: '';
    position: absolute;
    top: -14px; bottom: -14px; left: 0; right: 0;
  }
  .volume .fill {
    position: absolute; inset: 0 auto 0 0;
    background: var(--muted);
    border-radius: 2px;
    width: 70%;
  }
  .scroll-hint {
    margin-top: 26px;
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .scroll-hint a {
    color: var(--accent);
    text-decoration: none;
    transition: color 0.2s, opacity 0.2s;
    padding: 8px 20px;
    border: 1px solid var(--accent);
    border-radius: 24px;
    display: inline-block;
    animation: pulse-hint 2s ease-in-out infinite;
  }
  .scroll-hint a:hover { color: var(--text); border-color: var(--text); }
  @keyframes pulse-hint {
    0%, 100% { opacity: 0.7; }
    50% { opacity: 1; }
  }
  /* Sidebar / Playlist */
  .sidebar {
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 32px 0 28px;
    overflow: hidden;
  }
  .side-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 28px 18px;
    border-bottom: 1px solid var(--border);
  }
  .side-head h2 {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 22px;
  }
  .side-head .count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.1em;
  }
  .playlist {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px 16px;
  }
  .playlist::-webkit-scrollbar { width: 6px; }
  .playlist::-webkit-scrollbar-track { background: transparent; }
  .playlist::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .track {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s ease;
    position: relative;
  }
  .track:hover { background: rgba(255,255,255,0.03); }
  .track.active { background: rgba(232, 168, 124, 0.08); }
  .track.active .t-title { color: var(--accent); }
  .track .num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    width: 20px;
    flex-shrink: 0;
  }
  .track.active .num { color: var(--accent); }
  .track .thumb {
    width: 40px; height: 40px;
    border-radius: 6px;
    background: linear-gradient(135deg, #2a2520, #1c1814);
    flex-shrink: 0;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif;
    font-style: italic;
    color: var(--muted);
    font-size: 14px;
  }
  .track .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .track .meta { flex: 1; min-width: 0; }
  .t-title {
    font-size: 13px;
    font-weight: 400;
  }
  .t-tool {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.05em;
  }
  .t-dur {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }
  .empty {
    text-align: center;
    color: var(--dim);
    padding: 60px 20px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 15px;
  }
  /* DETAILS SECTION */
  .details {
    max-width: 1400px;
    margin: 0 auto;
    padding: 40px 32px 100px;
  }
  .details .section-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .details .section-label::before {
    content: '';
    display: block;
    width: 30px;
    height: 1px;
    background: var(--accent);
  }
  .details .headline {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(24px, 3.5vw, 36px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 28px;
  }
  .details .description {
    font-size: 18px;
    line-height: 1.65;
    color: var(--text);
    margin-bottom: 56px;
    max-width: 60ch;
    font-weight: 300;
    white-space: pre-line;
  }
  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    margin-bottom: 48px;
  }
  .detail-block .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }
  .prompt-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    line-height: 1.65;
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 16px 20px;
    color: var(--muted);
  }
  .tool-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: var(--accent-glow);
    border: 1px solid var(--accent);
    border-radius: 24px;
    color: var(--accent);
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.05em;
  }
  .tool-badge::before {
    content: none;
  }
  .reflection-text {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 19px;
    line-height: 1.6;
    color: var(--text);
    max-width: 62ch;
    padding-left: 24px;
    border-left: 2px solid var(--accent);
    font-weight: 400;
    white-space: pre-line;
  }
  .details-empty {
    text-align: center;
    padding: 80px 20px;
    font-family: 'Fraunces', serif;
    font-style: italic;
    color: var(--dim);
    font-size: 18px;
  }
  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--panel);
    border: 1px solid var(--accent-2);
    color: var(--text);
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 13px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 100;
    max-width: 90%;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  @media (max-width: 900px) {
    .top-section { grid-template-columns: 1fr; height: auto; padding: 16px; gap: 16px; }
    .sidebar { max-height: 50vh; }
    .art { width: 280px; }
    .detail-grid { grid-template-columns: 1fr; gap: 32px; }
    .details { padding: 24px 20px 60px; }
  }
</style>
</head>
<body>
<div class="top-section">
  <!-- PLAYER -->
  <section class="player">
    <div class="brand">
      <h1>Soundcheck</h1>
      <span class="tag">Generative AI for Sound & Music · Showcase Silke Sonnenberg</span>
    </div>

    <div class="art-wrap">
      <div class="art" id="art">
        <div class="placeholder" id="art-placeholder">♪</div>
        <img id="art-img" style="display:none" alt="">
        <canvas id="viz"></canvas>
      </div>
    </div>

    <div class="track-info">
      <div class="title" id="cur-title">Loading…</div>
      <div class="artist" id="cur-artist">Select a track to begin</div>
    </div>

    <div class="seek">
      <span id="cur-time">0:00</span>
      <div class="bar" id="seek-bar">
        <div class="fill" id="seek-fill"></div>
        <div class="knob" id="seek-knob"></div>
      </div>
      <span id="dur-time">0:00</span>
    </div>

    <div class="controls">
      <button class="btn" id="prev" title="Previous">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zm3.5 7l9-7v14z"/></svg>
      </button>
      <button class="btn play" id="play" title="Play / Pause">
        <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button class="btn" id="next" title="Next">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zm-3.5 7l-9 7V5z"/></svg>
      </button>
    </div>

    <div class="volume">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z"/></svg>
      <div class="bar" id="vol-bar"><div class="fill" id="vol-fill"></div></div>
    </div>

    <div class="scroll-hint">
      <a href="#details">↓ scroll for track details</a>
    </div>
  </section>

  <!-- PLAYLIST -->
  <aside class="sidebar">
    <div class="side-head">
      <h2>Tracks</h2>
      <span class="count" id="count">0 tracks</span>
    </div>
    <div class="playlist" id="playlist">
      <div class="empty">Loading tracks…</div>
    </div>
  </aside>
</div>

<!-- TRACK DETAILS -->
<section class="details" id="details">
  <div id="details-content">
    <div class="details-empty">Select a track to view details</div>
  </div>
</section>

<div class="toast" id="toast"></div>

<script>
(() => {
  // ---------- State ----------
  let tracks = [];
  let currentIdx = -1;
  let isPlaying = false;
  const audio = new Audio();
  let audioCtx = null, analyser = null, dataArray = null, sourceNode = null, rafId = null;

  // ---------- DOM ----------
  const $ = id => document.getElementById(id);
  const elPlay = $('play'), elPrev = $('prev'), elNext = $('next');
  const iconPlay = $('icon-play'), iconPause = $('icon-pause');
  const elCurTitle = $('cur-title'), elCurArtist = $('cur-artist');
  const elCurTime = $('cur-time'), elDurTime = $('dur-time');
  const elSeekBar = $('seek-bar'), elSeekFill = $('seek-fill'), elSeekKnob = $('seek-knob');
  const elVolBar = $('vol-bar'), elVolFill = $('vol-fill');
  const elPlaylist = $('playlist'), elCount = $('count');
  const elArt = $('art'), elArtImg = $('art-img'), elArtPh = $('art-placeholder');
  const elDetailsContent = $('details-content');
  const canvas = $('viz'), ctx = canvas.getContext('2d');
  const elToast = $('toast');

  audio.volume = 0.7;
  elVolFill.style.width = '70%';

  // ---------- Toast ----------
  let toastTimer = null;
  function showToast(msg, ms = 3500) {
    elToast.textContent = msg;
    elToast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => elToast.classList.remove('show'), ms);
  }

  // ---------- Audio context ----------
  function setupAudioContext() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 128;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    sourceNode = audioCtx.createMediaElementSource(audio);
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
  }

  // ---------- Visualizer ----------
  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = canvas.clientWidth * dpr;
    canvas.height = canvas.clientHeight * dpr;
    ctx.scale(dpr, dpr);
  }
  window.addEventListener('resize', resizeCanvas);
  setTimeout(resizeCanvas, 50);

  function drawViz() {
    rafId = requestAnimationFrame(drawViz);
    if (!analyser) return;
    analyser.getByteFrequencyData(dataArray);
    const w = canvas.clientWidth, h = canvas.clientHeight;
    ctx.clearRect(0, 0, w, h);
    const bars = dataArray.length;
    const gap = 2;
    const barW = (w - gap * (bars - 1)) / bars;
    for (let i = 0; i < bars; i++) {
      const v = dataArray[i] / 255;
      const barH = v * h * 0.9;
      const x = i * (barW + gap);
      const y = h - barH;
      const grad = ctx.createLinearGradient(0, y, 0, h);
      grad.addColorStop(0, `rgba(232, 168, 124, ${0.9 * v + 0.1})`);
      grad.addColorStop(1, 'rgba(217, 119, 87, 0.05)');
      ctx.fillStyle = grad;
      ctx.fillRect(x, y, barW, barH);
    }
  }

  // ---------- Helpers ----------
  function fmtTime(s) {
    if (!isFinite(s) || s < 0) s = 0;
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function getDuration(url) {
    return new Promise(resolve => {
      const a = new Audio();
      a.preload = 'metadata';
      a.src = url;
      a.onloadedmetadata = () => resolve(a.duration);
      a.onerror = () => resolve(0);
    });
  }

  // ---------- Load tracks from JSON ----------
  async function loadTracks() {
    try {
      const res = await fetch('tracks.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error('tracks.json must be an array');
      tracks = data;
      // Get durations in background
      for (let i = 0; i < tracks.length; i++) {
        getDuration(tracks[i].audio).then(d => {
          tracks[i].duration = d;
          renderPlaylist();
        });
      }
      updateCount();
      renderPlaylist();
      if (tracks.length > 0) selectTrack(0);
      else elDetailsContent.innerHTML = '<div class="details-empty">No tracks found in tracks.json</div>';
    } catch (e) {
      console.error(e);
      showToast(`Couldn't load tracks.json — ${e.message}`, 6000);
      elPlaylist.innerHTML = `<div class="empty">Couldn't load tracks.json.<br><small style="font-family:'IBM Plex Mono', monospace; font-size:11px">${escapeHtml(e.message)}</small></div>`;
    }
  }

  function updateCount() {
    elCount.textContent = `${tracks.length} track${tracks.length === 1 ? '' : 's'}`;
  }

  // ---------- Render ----------
  function renderPlaylist() {
    if (tracks.length === 0) {
      elPlaylist.innerHTML = '<div class="empty">No tracks loaded</div>';
      return;
    }
    elPlaylist.innerHTML = tracks.map((t, i) => `
      <div class="track ${i === currentIdx ? 'active' : ''}" data-idx="${i}">
        <span class="num">${String(i + 1).padStart(2, '0')}</span>
        <div class="thumb">${t.cover ? `<img src="${escapeHtml(t.cover)}" alt="" onerror="this.style.display='none';this.parentElement.textContent='${(t.headline||'?').charAt(0).toUpperCase()}'">` : (t.headline || '?').charAt(0).toUpperCase()}</div>
        <div class="meta">
          <div class="t-title">${escapeHtml(t.headline || 'Untitled')}</div>
          <div class="t-tool">${escapeHtml(t.tool || '—')}</div>
        </div>
        <span class="t-dur">${fmtTime(t.duration)}</span>
      </div>
    `).join('');
    elPlaylist.querySelectorAll('.track').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.idx, 10);
        playTrack(idx);
      });
    });
  }

  function renderDetails(t) {
    if (!t) {
      elDetailsContent.innerHTML = '<div class="details-empty">Select a track to view details</div>';
      return;
    }
    elDetailsContent.innerHTML = `
      <div class="section-label">About this track</div>
      <h1 class="headline">${escapeHtml(t.headline || 'Untitled')}</h1>
      ${t.description ? `<p class="description">${escapeHtml(t.description)}</p>` : ''}
      <div class="detail-grid">
        ${t.prompt ? `
          <div class="detail-block">
            <div class="label">Prompt</div>
            <div class="prompt-text">${escapeHtml(t.prompt)}</div>
          </div>` : ''}
        ${t.tool ? `
          <div class="detail-block">
            <div class="label">Tool</div>
            <span class="tool-badge">${escapeHtml(t.tool)}</span>
          </div>` : ''}
      </div>
      ${t.reflection ? `
        <div class="detail-block">
          <div class="label">Reflection</div>
          <p class="reflection-text">${escapeHtml(t.reflection)}</p>
        </div>` : ''}
    `;
  }

  function updateTrackDisplay(t) {
    elCurTitle.textContent = t.headline || 'Untitled';
    elCurArtist.textContent = t.tool || '—';
    if (t.cover) {
      elArtImg.src = t.cover;
      elArtImg.onload = () => {
        elArtImg.style.display = 'block';
        elArtPh.style.display = 'none';
      };
      elArtImg.onerror = () => {
        elArtImg.style.display = 'none';
        elArtPh.style.display = 'flex';
        elArtPh.textContent = (t.headline || '♪').charAt(0).toUpperCase();
      };
    } else {
      elArtImg.style.display = 'none';
      elArtPh.style.display = 'flex';
      elArtPh.textContent = (t.headline || '♪').charAt(0).toUpperCase();
    }
  }

  // ---------- Playback ----------
  function selectTrack(idx) {
    if (idx < 0 || idx >= tracks.length) return;
    currentIdx = idx;
    const t = tracks[idx];
    updateTrackDisplay(t);
    renderDetails(t);
    renderPlaylist();
  }

  async function playTrack(idx) {
    if (idx < 0 || idx >= tracks.length) return;
    const isSameTrack = idx === currentIdx && audio.src;
    selectTrack(idx);
    const t = tracks[idx];

    setupAudioContext();
    if (audioCtx && audioCtx.state === 'suspended') await audioCtx.resume();

    if (!isSameTrack) {
      audio.src = t.audio;
      audio.load();
    }

    try {
      await audio.play();
      isPlaying = true;
      updatePlayIcon();
      if (!rafId) drawViz();
      elArt.classList.add('playing');
    } catch (e) {
      console.error('Play failed', e);
      if (e.name === 'NotSupportedError') {
        showToast(`Can't play "${t.headline}" — format not supported`);
        if (tracks.length > 1) setTimeout(nextTrack, 300);
      } else if (e.name === 'NotAllowedError') {
        showToast('Click play to start (browser blocked autoplay)');
      } else {
        showToast(`Playback error: ${e.message}`);
      }
      isPlaying = false;
      updatePlayIcon();
    }
  }

  function togglePlay() {
    if (tracks.length === 0) {
      showToast('No tracks loaded');
      return;
    }
    if (!audio.src) {
      return playTrack(currentIdx >= 0 ? currentIdx : 0);
    }
    if (audio.paused) {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      audio.play().catch(e => {
        console.error('Play failed', e);
        showToast(`Playback error: ${e.message}`);
      });
      isPlaying = true;
      elArt.classList.add('playing');
    } else {
      audio.pause();
      isPlaying = false;
      elArt.classList.remove('playing');
    }
    updatePlayIcon();
  }

  function updatePlayIcon() {
    iconPlay.style.display = isPlaying ? 'none' : 'block';
    iconPause.style.display = isPlaying ? 'block' : 'none';
  }

  function nextTrack() {
    if (tracks.length === 0) return;
    playTrack((currentIdx + 1) % tracks.length);
  }
  function prevTrack() {
    if (tracks.length === 0) return;
    if (audio.currentTime > 3) { audio.currentTime = 0; return; }
    playTrack((currentIdx - 1 + tracks.length) % tracks.length);
  }

  // ---------- Event wiring ----------
  elPlay.addEventListener('click', togglePlay);
  elNext.addEventListener('click', nextTrack);
  elPrev.addEventListener('click', prevTrack);

  audio.addEventListener('timeupdate', () => {
    const cur = audio.currentTime, dur = audio.duration || 0;
    elCurTime.textContent = fmtTime(cur);
    elDurTime.textContent = fmtTime(dur);
    const pct = dur ? (cur / dur) * 100 : 0;
    elSeekFill.style.width = pct + '%';
    elSeekKnob.style.left = pct + '%';
  });
  audio.addEventListener('ended', nextTrack);
  audio.addEventListener('loadedmetadata', () => {
    elDurTime.textContent = fmtTime(audio.duration);
  });
  audio.addEventListener('error', () => {
    const err = audio.error;
    if (!err) return;
    const codes = { 1: 'Loading aborted', 2: 'Network error', 3: 'Decoding failed', 4: 'Format not supported' };
    showToast(`Audio error: ${codes[err.code] || 'Unknown'}`);
  });

  function seekFromEvent(e) {
    const rect = elSeekBar.getBoundingClientRect();
    const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
    const pct = Math.max(0, Math.min(1, x / rect.width));
    if (audio.duration) audio.currentTime = pct * audio.duration;
  }
  let seeking = false;
  elSeekBar.addEventListener('mousedown', e => { seeking = true; seekFromEvent(e); });
  elSeekBar.addEventListener('touchstart', e => { e.preventDefault(); seeking = true; seekFromEvent(e); }, {passive: false});
  window.addEventListener('mousemove', e => { if (seeking) seekFromEvent(e); });
  window.addEventListener('touchmove', e => { if (seeking) seekFromEvent(e); }, {passive: true});
  window.addEventListener('mouseup', () => { seeking = false; });
  window.addEventListener('touchend', () => { seeking = false; });

  function volFromEvent(e) {
    const rect = elVolBar.getBoundingClientRect();
    const x = (e.clientX || (e.touches && e.touches[0].clientX)) - rect.left;
    const pct = Math.max(0, Math.min(1, x / rect.width));
    audio.volume = pct;
    elVolFill.style.width = (pct * 100) + '%';
  }
  let voling = false;
  elVolBar.addEventListener('mousedown', e => { voling = true; volFromEvent(e); });
  elVolBar.addEventListener('touchstart', e => { e.preventDefault(); voling = true; volFromEvent(e); }, {passive: false});
  window.addEventListener('mousemove', e => { if (voling) volFromEvent(e); });
  window.addEventListener('touchmove', e => { if (voling) volFromEvent(e); }, {passive: true});
  window.addEventListener('mouseup', () => { voling = false; });
  window.addEventListener('touchend', () => { voling = false; });

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowRight') nextTrack();
    if (e.code === 'ArrowLeft') prevTrack();
  });

  // Start
  loadTracks();
})();
</script>
</body>
</html>
